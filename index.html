function weightedSample(ex,n){
  const secs=EXAMS[ex].sections;const keys=Object.keys(secs);
  const pools={};keys.forEach(k=>pools[k]=shuffle(bank(ex,k)));
  const totalW=keys.reduce((a,k)=>a+secs[k].w,0);
  const want={};let got=0;
  keys.forEach(k=>{want[k]=Math.min(pools[k].length,Math.floor(n*secs[k].w/totalW));got+=want[k]});
  // fill remainder by largest weight with spare questions
  const order=keys.slice().sort((a,b)=>secs[b].w-secs[a].w);
  while(got<n){let added=false;for(const k of order){if(got>=n)break;if(want[k]<pools[k].length){want[k]++;got++;added=true}}if(!added)break}
  let out=[];keys.forEach(k=>out=out.concat(pools[k].slice(0,want[k])));
  return shuffle(out);
}
function startMock(ex,n){
  const qs=weightedSample(ex,n);
  const sess={ex,feedback:S.mockFeedback,list:qs.map(q=>({id:q.id,order:shuffle([0,1,2,3]),pick:null,flag:false})),i:0,
    end:Date.now()+Math.round(qs.length*S.mockMinPerQ*60000),showGrid:false,done:false};
  stopTimer();timerId=setInterval(()=>tick(sess),1000);
  mockQ(sess);
}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function tick(sess){const el=document.getElementById("tm");const left=sess.end-Date.now();if(el){el.textContent=fmt(left);el.classList.toggle("low",left<5*60000)}
  if(left<=0&&!sess.done){finishMock(sess,true)}}
function mockQ(sess){
  rerender=()=>mockQ(sess);
  setTitle(sess.full?"全真模拟":"模拟考试",()=>{confirmExit(sess)});
  const it=sess.list[sess.i],q=QMAP[it.id],letters="ABCD";
  const reveal=sess.feedback&&it.pick!==null;
  const answeredN=sess.list.filter(x=>x.pick!==null).length;
  const opts=it.order.map((oi,pos)=>{let cls="opt";
    if(reveal){if(oi===0)cls+=" right";else if(oi===it.pick)cls+=" wrong"}
    else if(it.pick===oi)cls+=" sel";
    return `<button class="${cls}" data-oi="${oi}"><span class="k">${letters[pos]}</span><span class="tx">${Tinline(q.o[oi])}</span></button>`}).join("");
  const ok=it.pick===0;
  $app.innerHTML=`
  <div class="topline"><span class="pill">第 ${sess.i+1} / ${sess.list.length} 题 · 已答 ${answeredN}</span><span class="timer" id="tm">${fmt(sess.end-Date.now())}</span></div>
  <section class="card">${T(q.q)}<div class="opts">${opts}</div>
    <div class="row"><button class="btn" id="flag" style="min-height:36px;padding:6px 10px">${it.flag?"★ 已标记":"☆ 标记待查"}</button><button class="btn" id="gridT" style="min-height:36px;padding:6px 10px">${sess.showGrid?"收起题号":"题号总览"}</button></div>
    ${sess.showGrid?`<div class="grid">${sess.list.map((x,k)=>{let c="chip";if(x.pick!==null)c+=sess.feedback?(x.pick===0?" ok":" bad"):" done";if(k===sess.i)c+=" cur";if(x.flag)c+=" flag";return `<button class="${c}" data-go="${k}">${k+1}</button>`}).join("")}</div>`:""}
  </section>
  ${reveal?`<section class="card"><div class="verdict ${ok?"ok":"bad"}">${ok?"✓ 正确":"✗ 错误"}</div>
    ${ok?"":`<div class="small">正确答案：${Tinline(q.o[0])}</div><div class="exp bad">${S.lang!=="zh"?P(hlExp(q.e[0])):""}${S.lang!=="en"?P(hlExp(q.e[1])):""}</div>`}
    <div class="src">出处 Source: ${esc(q.s)}</div></section>`:""}
  <div class="toolbar">
    <button class="btn" id="prev" ${sess.i===0?"disabled":""}>‹ 上一题</button>
    ${sess.i+1<sess.list.length?`<button class="btn primary" id="nx">下一题 ›</button>`:`<button class="btn primary" id="sub">交卷</button>`}
  </div>
  ${sess.i+1<sess.list.length?`<button class="btn" id="sub2">提前交卷</button>`:""}
  <div id="confirm"></div>`;
  $app.onclick=e=>{
    const o=e.target.closest(".opt");
    if(o){if(sess.feedback&&it.pick!==null)return;it.pick=+o.dataset.oi;mockQ(sess);return}
    const g=e.target.closest("[data-go]");if(g){sess.i=+g.dataset.go;mockQ(sess);return}
    const id=e.target.id;
    if(id==="flag"){it.flag=!it.flag;mockQ(sess)}
    if(id==="gridT"){sess.showGrid=!sess.showGrid;mockQ(sess)}
    if(id==="prev"){sess.i--;mockQ(sess);window.scrollTo(0,0)}
    if(id==="nx"){sess.i++;mockQ(sess);window.scrollTo(0,0)}
    if(id==="sub"||id==="sub2"){askSubmit(sess)}
    if(id==="yes")finishMock(sess,false);
    if(id==="no")document.getElementById("confirm").innerHTML="";
    if(id==="quit"){stopTimer();if(sess.full)restoreLang();home()}
  };
}
function askSubmit(sess){
  const un=sess.list.filter(x=>x.pick===null).length;
  document.getElementById("confirm").innerHTML=`<section class="card"><b>确认交卷？</b>${un?`<span class="fail">还有 ${un} 题未作答，按错题计。</span>`:""}<div class="row"><button class="btn primary grow" id="yes">交卷</button><button class="btn grow" id="no">继续作答</button></div></section>`;

function confirmExit(sess){

  document.getElementById("confirm").scrollIntoView({behavior:"smooth"});
}
function finishMock(sess,timeout){
  if(sess.done)return;sess.done=true;stopTimer();
  sess.list.forEach(x=>record(x.id,x.pick===0));
  const n=sess.list.length,c=sess.list.filter(x=>x.pick===0).length,pct=Math.round(c/n*100);

function mockResult(sess,timeout){

  };

}
