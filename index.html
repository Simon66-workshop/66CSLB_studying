<style>
/* Layout: single column "job binder" — a sticky title block like a drawing sheet, cards below; max 640px */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18222e; --muted:#5b6876; --line:#d3dae2;
  --accent:#d9591c; --accent-ink:#ffffff; --blue:#1f4e79; --blue-soft:#e3ecf5;
  --hl:#b8460f; --hl-bg:#fdeadf; --ok:#1d7a46; --ok-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fff3d6;
  --f-display:"IBM Plex Sans Condensed","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --ink:#e6ebf0; --muted:#9aa7b4; --line:#2c3845;
  --accent:#f07a3e; --accent-ink:#1a0d05; --blue:#8fbbe6; --blue-soft:#1d2d3d;
  --hl:#ffab7a; --hl-bg:#3d2414; --ok:#5cc98a; --ok-soft:#163324; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#f2c260; --warn-soft:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --ink:#e6ebf0; --muted:#9aa7b4; --line:#2c3845;
  --accent:#f07a3e; --accent-ink:#1a0d05; --blue:#8fbbe6; --blue-soft:#1d2d3d;
  --hl:#ffab7a; --hl-bg:#3d2414; --ok:#5cc98a; --ok-soft:#163324; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#f2c260; --warn-soft:#3a2f12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blue);color:#fff}
header.bar .in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
header.bar h1{font-family:var(--f-display);font-size:19px;margin:0;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.bar .back{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:5px 10px;font-size:14px}
.lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:8px;overflow:hidden}
.lang button{background:transparent;border:0;color:#fff;padding:5px 8px;font-size:13px}
.lang button[aria-pressed="true"]{background:#fff;color:#1f4e79;font-weight:600}
h2{font-family:var(--f-display);font-size:20px;margin:4px 0 0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;min-height:44px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.btn.grow{flex:1 1 140px}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.seclist{display:flex;flex-direction:column;gap:6px}
.secrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.secrow .t{flex:1;min-width:0}
.secrow .w{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.q-en{font-weight:600}
.q-zh{color:var(--ink)}
.bi .q-zh{color:var(--muted);font-size:15px;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:48px}
.opt .k{font-family:var(--f-mono);font-weight:500;width:24px;height:24px;flex:none;border-radius:6px;background:var(--bg);display:grid;place-items:center;font-size:13px}
.opt .tx{flex:1;min-width:0}
.opt .tx small{display:block;color:var(--muted);font-size:14px}
.small small{display:block;color:var(--muted)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong .k{background:var(--bad);color:#fff}
.verdict{font-family:var(--f-display);font-size:18px;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.exp{border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 10px 10px 0;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.exp.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.src{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-word}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.timer{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:40px;font-family:var(--f-mono);font-size:13px;cursor:pointer}
.chip.done{background:var(--blue-soft);border-color:var(--blue)}
.chip.ok{background:var(--ok-soft);border-color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad)}
.chip.cur{outline:2px solid var(--accent)}
.chip.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.toolbar{display:flex;gap:8px;position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.toolbar .btn{flex:1}
.hl{color:var(--hl);background:var(--hl-bg);font-family:var(--f-display);font-weight:700;padding:0 4px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hl.warnc{color:var(--bad);background:var(--bad-soft)}
.hl-big{color:var(--accent);font-size:1.15em;margin-left:4px}
.cite{font-family:var(--f-mono);font-size:.88em;color:var(--blue);background:var(--blue-soft);padding:0 3px;border-radius:3px;white-space:nowrap}
.hero{border-top:4px solid var(--accent)}
.study{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.study .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px}
.study .btn small{font-weight:400;color:var(--muted);font-size:12px}
.study .btn.span2{grid-column:1/-1}
.study .btn.full{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.study .btn.full small{color:var(--bg);opacity:.75}
.wk{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:6px;font-weight:500}
.wk.lb{background:var(--blue-soft);color:var(--blue)} .wk.bt{background:var(--hl-bg);color:var(--hl)}
.week.is-done{opacity:.6}
.week.is-cur{border:2px solid var(--accent)}
.goal{font-size:14px}
.keycard{border-left:5px solid var(--blue)} .keycard.bt{border-left-color:var(--accent)}
ul.keys{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;line-height:1.7}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.chip{transition:background-color .15s,border-color .15s}}
</style>

<script>
// Original practice questions written from public sources. NOT actual CSLB exam questions.
// Convention: the correct option is always o[0]; the app shuffles options at display time.
// Fields: id, ex (LB|B), sec (section key), q [en, zh], o [[en,zh] x4], e [en, zh] explanation, s source
const QUESTIONS = [
// ===================== LAW & BUSINESS =====================
// --- Business Organization and Licensing (org) ---
{id:"LB-ORG-01",ex:"LB",sec:"org",
 q:["Since January 1, 2025, an unlicensed person may perform a job without a CSLB license only if the total price (labor + materials) is under a certain amount, no permit is required, and the person employs no one on the job. What is that amount?","自2025年1月1日起，无执照者可承接的“小型工程豁免”需满足：总价（人工+材料）低于某金额、无需许可证（permit）、且不雇佣任何人。这个金额是多少？"],
 o:[["$1,000","1,000美元"],["$500","500美元"],["$5,000","5,000美元"],["$15,000","15,000美元"]],
 e:["AB 2622 raised the minor work exemption in B&P Code §7048 from $500 to $1,000, effective Jan 1, 2025. The exemption is lost if the work requires a permit of any kind or if the unlicensed person employs anyone.","AB 2622 将 B&P Code §7048 的小型工程豁免从500美元提高到1,000美元，2025年1月1日生效。只要工程需要任何许可证，或无执照者雇佣了任何人，就不适用豁免。"],
 s:"B&P Code §7048; CSLB Industry Bulletin “AB 2622 Implementation” (2024)"},
{id:"LB-ORG-02",ex:"LB",sec:"org",
 q:["What is the amount of the contractor's bond that every active CSLB licensee must maintain (effective January 1, 2023)?","所有有效（active）CSLB执照持有人必须维持的承包商保证金（contractor's bond）金额是多少（2023年1月1日起）？"],
 o:[["$25,000","25,000美元"],["$15,000","15,000美元"],["$12,500","12,500美元"],["$100,000","100,000美元"]],
 e:["SB 607 increased the contractor's bond under B&P Code §7071.6 from $15,000 to $25,000 for licenses issued, reactivated, reinstated or renewed on or after Jan 1, 2023.","SB 607 把 B&P Code §7071.6 规定的承包商保证金从15,000美元提高到25,000美元，适用于2023年1月1日及以后签发、激活、恢复或续期的执照。"],
 s:"B&P Code §7071.6; CSLB “Bond Requirements” page"},
{id:"LB-ORG-03",ex:"LB",sec:"org",
 q:["A licensee changes its business address. Within how many days must CSLB be notified?","执照持有人变更营业地址，必须在多少天内通知CSLB？"],
 o:[["90 days","90天"],["30 days","30天"],["10 days","10天"],["1 year","1年"]],
 e:["B&P Code §7083 requires licensees to notify the Registrar in writing within 90 days of any change to the information on file, such as address, business name, or personnel.","B&P Code §7083 要求执照持有人在档案信息（地址、商号、人员等）变更后90天内书面通知登记官（Registrar）。"],
 s:"B&P Code §7083"},
{id:"LB-ORG-04",ex:"LB",sec:"org",
 q:["If the qualifying individual (RMO/RME) disassociates from the license, how long does the licensee have to notify CSLB and to replace the qualifier before the license is suspended?","若执照的资格人（RMO/RME）离开，执照持有人需在多久内通知CSLB并更换资格人，否则执照会被暂停？"],
 o:[["Notify within 90 days; replace within 90 days","90天内通知；90天内更换"],["Notify within 10 days; replace within 30 days","10天内通知；30天内更换"],["Notify within 30 days; replace within 1 year","30天内通知；1年内更换"],["No notice needed; replace at next renewal","无需通知；下次续期时更换即可"]],
 e:["Under B&P Code §7068.2, the licensee must notify the Registrar in writing within 90 days after the qualifier disassociates, and has 90 days from disassociation to replace the qualifier, or the license is automatically suspended (an extension may be requested).","根据 B&P Code §7068.2，资格人离开后90天内必须书面通知登记官，并须在离开之日起90天内更换资格人，否则执照自动暂停（可申请延期）。"],
 s:"B&P Code §7068.2"},
{id:"LB-ORG-05",ex:"LB",sec:"org",
 q:["How often must an active contractor license be renewed?","有效的承包商执照多久续期一次？"],
 o:[["Every 2 years","每2年"],["Every year","每年"],["Every 4 years","每4年"],["Never; it is permanent","不需要，永久有效"]],
 e:["Active licenses expire two years from the last day of the month in which they were issued and must be renewed every two years (B&P Code §7140). Inactive licenses are renewed every four years (§7076.1).","有效执照在签发当月最后一天起满两年到期，须每两年续期（B&P Code §7140）。非活跃（inactive）执照每四年续期一次（§7076.1）。"],
 s:"B&P Code §7140, §7076.1"},
{id:"LB-ORG-06",ex:"LB",sec:"org",
 q:["Which of the following must appear in all advertising by a licensed contractor (including vehicles, business cards and websites)?","持照承包商的所有广告（包括车身、名片、网站）都必须包含以下哪项？"],
 o:[["The contractor's license number","承包商执照号码"],["The contractor's bond number","保证金编号"],["The workers' compensation policy number","工伤保险保单号"],["The qualifier's home address","资格人的住址"]],
 e:["B&P Code §7030.5 requires every licensee to include the license number in all bids, contracts, and advertising, and to show it on business cards and commercial vehicles (with limited exceptions).","B&P Code §7030.5 要求所有投标、合同、广告都必须写明执照号码，名片和商用车辆也须展示（有少数例外）。"],
 s:"B&P Code §7030.5"},
{id:"LB-ORG-07",ex:"LB",sec:"org",
 q:["A limited liability company (LLC) license must maintain liability insurance. For an LLC with five or fewer persons listed on the license, what is the minimum aggregate coverage?","有限责任公司（LLC）执照必须维持责任保险。若执照上登记人员不超过5人，最低总保额是多少？"],
 o:[["$1,000,000","100万美元"],["$500,000","50万美元"],["$100,000","10万美元"],["$5,000,000","500万美元"]],
 e:["B&P Code §7071.19 requires LLC licensees to carry liability insurance of at least $1,000,000 aggregate for five or fewer listed persons, plus $100,000 for each additional person, up to $5,000,000. LLCs must also file a $100,000 LLC employee/worker bond (§7071.6.5).","B&P Code §7071.19 要求LLC执照维持至少100万美元总保额的责任险（登记人员≤5人），每多1人加10万美元，上限500万美元。LLC另需提交10万美元的员工/工人保证金（§7071.6.5）。"],
 s:"B&P Code §7071.19, §7071.6.5"},
{id:"LB-ORG-08",ex:"LB",sec:"org",
 q:["A licensed general contractor hires an unlicensed person to perform a $6,000 electrical subcontract. This is:","持照总承包商雇用一名无执照者承包6,000美元的电气分包工程，这属于："],
 o:[["Cause for disciplinary action against the general contractor","总承包商会因此受到纪律处分"],["Legal, because the general contractor holds a license","合法，因为总承包商本身有执照"],["Legal if the owner approves in writing","只要业主书面同意即合法"],["Only a problem for the unlicensed person","只是无执照者的问题"]],
 e:["Under B&P Code §7118, entering into a contract with an unlicensed contractor for work requiring a license is cause for disciplinary action against the licensee. The unlicensed person also violates §7028.","根据 B&P Code §7118，持照人与无执照者签订需要执照的工程合同，构成对持照人的纪律处分事由；无执照者本身也违反 §7028。"],
 s:"B&P Code §7118, §7028"},
{id:"LB-ORG-09",ex:"LB",sec:"org",
 q:["What is the main practical consequence of B&P Code §7031 for a contractor who was unlicensed while performing work?","B&P Code §7031 对施工期间无执照的承包商最主要的后果是什么？"],
 o:[["They cannot sue to collect payment for that work, and the owner may sue to recover amounts paid","不能起诉追讨工程款，且业主可起诉要求返还已付款项"],["They pay a small administrative fee only","只需缴纳少量行政费用"],["They may collect payment but not profit","可收回成本但不能获利"],["Nothing, if the work passed inspection","只要验收通过就没有后果"]],
 e:["§7031(a) bars an unlicensed contractor from bringing or maintaining any action to collect compensation; §7031(b) lets a person who used an unlicensed contractor sue to recover all compensation paid.","§7031(a) 禁止无执照承包商提起任何追讨报酬的诉讼；§7031(b) 允许使用无执照承包商的一方起诉追回已支付的全部报酬。"],
 s:"B&P Code §7031"},
{id:"LB-ORG-10",ex:"LB",sec:"org",
 q:["Which business form generally protects the owners' personal assets from business debts?","哪种企业形式通常能使所有者的个人资产免受企业债务牵连？"],
 o:[["Corporation","公司（Corporation）"],["Sole proprietorship","个人独资（Sole proprietorship）"],["General partnership","普通合伙（General partnership）"],["Joint venture of two sole proprietors","两个独资者组成的联营体"]],
 e:["Shareholders of a corporation are generally liable only up to their investment. Sole proprietors and general partners have unlimited personal liability for business debts.","公司股东一般只以出资为限承担责任；独资业主和普通合伙人对企业债务承担无限个人责任。"],
 s:"NASCLA Contractors Guide to Business, Law and Project Management (CSLB L&B reference list); CSLB “Get Licensed to Build”"},

// --- Business Finances (fin) ---
{id:"LB-FIN-01",ex:"LB",sec:"fin",
 q:["A company has current assets of $300,000 and current liabilities of $150,000. What is its current ratio?","某公司流动资产300,000美元，流动负债150,000美元，流动比率是多少？"],
 o:[["2.0","2.0"],["0.5","0.5"],["$150,000","150,000美元"],["1.5","1.5"]],
 e:["Current ratio = current assets ÷ current liabilities = 300,000 ÷ 150,000 = 2.0. (Working capital would be 300,000 − 150,000 = $150,000.)","流动比率 = 流动资产 ÷ 流动负债 = 300,000 ÷ 150,000 = 2.0。（营运资金则为 300,000 − 150,000 = 150,000美元。）"],
 s:"NASCLA Contractors Guide (financial ratios chapter)"},
{id:"LB-FIN-02",ex:"LB",sec:"fin",
 q:["A job's estimated cost is $80,000. The contractor wants a 20% gross margin on the selling price. What should the price be?","某工程预估成本80,000美元，承包商希望售价中毛利率为20%。报价应为多少？"],
 o:[["$100,000","100,000美元"],["$96,000","96,000美元"],["$84,000","84,000美元"],["$120,000","120,000美元"]],
 e:["Margin is based on selling price: Price = Cost ÷ (1 − margin) = 80,000 ÷ 0.80 = $100,000. Adding a 20% markup on cost ($96,000) yields only a 16.7% margin, a common bidding error.","毛利率按售价计算：售价 = 成本 ÷ (1 − 毛利率) = 80,000 ÷ 0.80 = 100,000美元。若在成本上加20%（96,000美元），实际毛利率只有16.7%，是常见报价错误。"],
 s:"NASCLA Contractors Guide (markup vs. margin)"},
{id:"LB-FIN-03",ex:"LB",sec:"fin",
 q:["Under the accrual method of accounting, revenue is recorded when:","在权责发生制（accrual method）下，收入在何时入账？"],
 o:[["It is earned, regardless of when cash is received","收入实现（赚得）时，无论何时收到现金"],["Cash is received","收到现金时"],["The job is fully closed out","工程全部结清时"],["The tax return is filed","报税时"]],
 e:["Accrual accounting records revenue when earned and expenses when incurred. The cash method records them when cash changes hands.","权责发生制在收入赚得时确认收入、在费用发生时确认费用；收付实现制（cash method）则在现金收付时记账。"],
 s:"NASCLA Contractors Guide (accounting methods); IRS Publication 538"},
{id:"LB-FIN-04",ex:"LB",sec:"fin",
 q:["Which financial statement shows a company's assets, liabilities, and owner's equity at a specific point in time?","哪种财务报表反映公司在某一时点的资产、负债和所有者权益？"],
 o:[["Balance sheet","资产负债表"],["Income statement","利润表"],["Cash flow projection","现金流预测"],["Job cost report","工程成本报告"]],
 e:["The balance sheet is a snapshot: Assets = Liabilities + Owner's Equity. The income statement covers a period of time (revenue − expenses = profit).","资产负债表是某一时点的快照：资产 = 负债 + 所有者权益。利润表反映一段期间（收入 − 费用 = 利润）。"],
 s:"NASCLA Contractors Guide (financial statements)"},
{id:"LB-FIN-05",ex:"LB",sec:"fin",
 q:["Fixed overhead is $120,000 per year. Each job contributes, on average, 25% of its revenue toward overhead and profit. What annual revenue is needed to break even?","年固定管理费为120,000美元，每个工程平均有25%的收入用于覆盖管理费和利润。盈亏平衡需要多少年收入？"],
 o:[["$480,000","480,000美元"],["$150,000","150,000美元"],["$300,000","300,000美元"],["$30,000","30,000美元"]],
 e:["Break-even revenue = fixed costs ÷ contribution margin ratio = 120,000 ÷ 0.25 = $480,000.","盈亏平衡收入 = 固定成本 ÷ 边际贡献率 = 120,000 ÷ 0.25 = 480,000美元。"],
 s:"NASCLA Contractors Guide (break-even analysis)"},
{id:"LB-FIN-06",ex:"LB",sec:"fin",
 q:["How often must most employers file IRS Form 941 (Employer's Quarterly Federal Tax Return)?","大多数雇主需要多久提交一次IRS 941表（雇主季度联邦税申报）？"],
 o:[["Quarterly","每季度"],["Monthly","每月"],["Annually","每年"],["Only when an employee is hired","仅在雇人时"]],
 e:["Form 941 reports federal income tax withheld and Social Security/Medicare taxes and is filed each quarter (IRS Publication 15). Deposits themselves may be due monthly or semiweekly.","941表申报预扣的联邦所得税及社安/医保税，每季度提交一次（IRS Publication 15）。税款的缴存则可能按月或半周进行。"],
 s:"IRS Publication 15 (Circular E)"},
{id:"LB-FIN-07",ex:"LB",sec:"fin",
 q:["What is the employee's share of Social Security tax and Medicare tax (before any Additional Medicare Tax)?","员工承担的社会保障税和医疗保险税税率分别是多少（不含附加医保税）？"],
 o:[["6.2% and 1.45%","6.2% 和 1.45%"],["12.4% and 2.9%","12.4% 和 2.9%"],["7.65% and 1.45%","7.65% 和 1.45%"],["6.2% and 2.9%","6.2% 和 2.9%"]],
 e:["Per IRS Publication 15, Social Security is 6.2% each for employee and employer (up to the annual wage base) and Medicare is 1.45% each. Together 7.65% each side.","根据 IRS Publication 15，社会保障税员工与雇主各6.2%（有年度工资上限），医保税各1.45%，合计每方7.65%。"],
 s:"IRS Publication 15 (Circular E)"},
{id:"LB-FIN-08",ex:"LB",sec:"fin",
 q:["Which item is a current liability?","以下哪项属于流动负债？"],
 o:[["Accounts payable due to suppliers within 30 days","30天内到期的供应商应付账款"],["A 15-year mortgage balance due after next year","明年以后到期的15年期房贷余额"],["Accounts receivable","应收账款"],["Equipment owned by the company","公司自有设备"]],
 e:["Current liabilities are obligations due within one year, such as accounts payable. Accounts receivable and equipment are assets; long-term debt beyond one year is a long-term liability.","流动负债是一年内到期的债务，如应付账款。应收账款和设备是资产；一年以后到期的长期债务属于长期负债。"],
 s:"NASCLA Contractors Guide (financial statements)"},

// --- Employment Requirements (emp) ---
{id:"LB-EMP-01",ex:"LB",sec:"emp",
 q:["Within how many days of hire must a California employer report a new employee to the EDD (Form DE 34)?","加州雇主须在雇用新员工后多少天内向EDD申报（DE 34表）？"],
 o:[["20 days","20天"],["3 days","3天"],["30 days","30天"],["90 days","90天"]],
 e:["California employers must report new or rehired employees to the EDD within 20 days of the start-of-work date (California Employer's Guide, DE 44).","加州雇主须在员工开始工作之日起20天内向EDD申报新雇或重新雇用的员工（《加州雇主指南》DE 44）。"],
 s:"EDD California Employer's Guide (DE 44), New Employee Registry"},
{id:"LB-EMP-02",ex:"LB",sec:"emp",
 q:["By when must the employer complete Section 2 of Form I-9 (Employment Eligibility Verification)?","雇主须在何时之前完成I-9表（就业资格验证）的第2部分？"],
 o:[["Within 3 business days after the employee's first day of work","员工首个工作日后的3个工作日内"],["Before the job offer is made","发出录用通知之前"],["Within 30 days of hire","雇用后30天内"],["At the end of the first year","第一年结束时"]],
 e:["USCIS rules require the employee to complete Section 1 by the first day of work and the employer to complete Section 2 within 3 business days of the first day of employment.","USCIS规定员工须在首个工作日前完成第1部分，雇主须在首个工作日后3个工作日内完成第2部分。"],
 s:"USCIS Form I-9 Instructions; 8 CFR §274a.2"},
{id:"LB-EMP-03",ex:"LB",sec:"emp",
 q:["Under California law, a non-exempt employee who works 13 hours in one workday is owed what rate for the hours beyond 12?","根据加州法律，非豁免员工一天工作13小时，超过12小时的部分应按什么费率支付？"],
 o:[["Double the regular rate","正常工资的2倍"],["1.5 times the regular rate","正常工资的1.5倍"],["The regular rate","正常工资"],["Nothing extra if weekly hours are under 40","若周工时不足40小时则无额外"]],
 e:["Labor Code §510: hours over 8 in a workday (and over 40 in a workweek) are paid at 1.5×; hours over 12 in a workday are paid at 2×.","劳动法典 §510：一天超过8小时（及一周超过40小时）按1.5倍支付；一天超过12小时的部分按2倍支付。"],
 s:"California Labor Code §510"},
{id:"LB-EMP-04",ex:"LB",sec:"emp",
 q:["An employer fires an employee. When are the final wages due?","雇主解雇一名员工，最终工资应于何时支付？"],
 o:[["Immediately, at the time of discharge","解雇时立即支付"],["Within 72 hours","72小时内"],["On the next regular payday","下一个常规发薪日"],["Within 30 days","30天内"]],
 e:["Labor Code §201 requires wages earned and unpaid at the time of discharge to be paid immediately. If an employee quits without 72 hours' notice, wages are due within 72 hours (§202). Late payment can trigger waiting-time penalties (§203).","劳动法典 §201 规定被解雇员工的已赚未付工资须立即支付。员工未提前72小时通知而辞职的，须在72小时内支付（§202）。迟付可能产生等待期罚金（§203）。"],
 s:"California Labor Code §§201–203"},
{id:"LB-EMP-05",ex:"LB",sec:"emp",
 q:["An employee works a 6-hour shift. Under California law, what meal period must be provided?","员工一个班次工作6小时，按加州法律必须提供什么用餐休息？"],
 o:[["A 30-minute meal period (may be waived by mutual consent only if the shift is 6 hours or less)","30分钟用餐时间（仅当班次不超过6小时，可经双方同意放弃）"],["No meal period","不需要用餐时间"],["A 10-minute paid break only","仅10分钟带薪休息"],["A 60-minute meal period","60分钟用餐时间"]],
 e:["Labor Code §512 requires a 30-minute meal period for work periods of more than 5 hours; it may be waived by mutual consent when the total work period is no more than 6 hours. Separately, 10-minute paid rest breaks are required per 4 hours worked or major fraction (IWC Wage Order 16).","劳动法典 §512：工作超过5小时须提供30分钟用餐时间；若总工时不超过6小时可经双方同意放弃。另外，每工作4小时（或其主要部分）须给10分钟带薪休息（IWC工资令16号）。"],
 s:"California Labor Code §512; IWC Wage Order 16"},
{id:"LB-EMP-06",ex:"LB",sec:"emp",
 q:["How long must a California employer keep payroll records (including itemized wage statements)?","加州雇主须保存工资记录（含工资明细单）多长时间？"],
 o:[["At least 3 years","至少3年"],["1 year","1年"],["6 months","6个月"],["Until the employee leaves","直到员工离职"]],
 e:["Labor Code §226(a) and §1174(d) require payroll records and copies of wage statements to be kept for at least three years.","劳动法典 §226(a) 与 §1174(d) 规定工资记录及工资明细副本须保存至少三年。"],
 s:"California Labor Code §226, §1174"},
{id:"LB-EMP-07",ex:"LB",sec:"emp",
 q:["Which form does a new employee complete so the employer can withhold federal income tax?","新员工填写哪份表格，以便雇主预扣联邦所得税？"],
 o:[["Form W-4","W-4表"],["Form W-2","W-2表"],["Form 1099-NEC","1099-NEC表"],["Form 940","940表"]],
 e:["The employee gives Form W-4 to the employer for federal withholding (California uses Form DE 4 for state withholding). The W-2 is the year-end wage statement; the 1099-NEC is for nonemployees; Form 940 is the annual FUTA return.","员工提交W-4表供雇主预扣联邦税（加州州税预扣用DE 4表）。W-2是年终工资单；1099-NEC用于非雇员；940是年度联邦失业税申报表。"],
 s:"IRS Publication 15; EDD DE 44"},
{id:"LB-EMP-08",ex:"LB",sec:"emp",
 q:["How often must California employers generally pay non-exempt employees?","加州雇主一般应多久向非豁免员工发一次工资？"],
 o:[["At least twice each calendar month on designated paydays","每个日历月至少两次，在指定发薪日"],["Once a month","每月一次"],["Once a quarter","每季度一次"],["Whenever the job is completed","工程完工时"]],
 e:["Labor Code §204 requires most wages to be paid at least twice during each calendar month on regular paydays designated in advance.","劳动法典 §204 规定大多数工资须在每个日历月至少支付两次，在事先指定的常规发薪日支付。"],
 s:"California Labor Code §204"},
{id:"LB-EMP-09",ex:"LB",sec:"emp",
 q:["How long must an employer retain a completed Form I-9 for a terminated employee?","员工离职后，雇主须保留其I-9表多久？"],
 o:[["3 years after hire or 1 year after termination, whichever is later","雇用后3年或离职后1年，以较晚者为准"],["1 year after hire","雇用后1年"],["7 years after termination","离职后7年"],["It can be destroyed at termination","离职即可销毁"]],
 e:["USCIS requires retention for 3 years after the date of hire or 1 year after employment ends, whichever is later.","USCIS要求保留至雇用日起3年或离职后1年，以较晚者为准。"],
 s:"USCIS Form I-9 Instructions; 8 CFR §274a.2(b)(2)"},

// --- Insurance and Liens (ins) ---
{id:"LB-INS-01",ex:"LB",sec:"ins",
 q:["A licensed contractor (not in a classification with a special rule) has one part-time employee. Is workers' compensation insurance required?","一位持照承包商（不属于特殊规定的类别）只有一名兼职员工，是否必须购买工伤保险？"],
 o:[["Yes; any employer with even one employee must carry it","是；即使只有一名员工也必须投保"],["No; only employers with 5+ employees","否；5名员工以上才需要"],["No; part-time employees are exempt","否；兼职员工豁免"],["Only if the job exceeds $25,000","仅当工程超过25,000美元"]],
 e:["Labor Code §3700 requires every employer to secure workers' compensation. B&P Code §7125 requires licensees with employees to keep a certificate on file with CSLB. Note: the requirement for ALL licensees (even without employees) was delayed by SB 1455 to Jan 1, 2028; C-8, C-20, C-22, C-39 and D-49 already must carry it regardless.","劳动法典 §3700 要求所有雇主投保工伤保险。B&P Code §7125 要求有员工的持照人在CSLB备案保险证明。注：要求“所有持照人（即使没有员工）”都投保的规定已被 SB 1455 推迟至2028年1月1日；C-8、C-20、C-22、C-39、D-49 类别目前无论有无员工都必须投保。"],
 s:"Labor Code §3700; B&P Code §7125; SB 216 (2021), SB 1455 (2024)"},
{id:"LB-INS-02",ex:"LB",sec:"ins",
 q:["On a private works project, within how many days after first furnishing labor or materials should a subcontractor serve the 20-day preliminary notice to preserve full lien rights?","私人工程中，分包商应在首次提供人工或材料后多少天内送达“20天初步通知”，才能完整保留留置权？"],
 o:[["20 days","20天"],["10 days","10天"],["30 days","30天"],["90 days","90天"]],
 e:["Civil Code §8204: the preliminary notice must be given no later than 20 days after the claimant first furnishes work. A later notice still preserves rights only for work furnished within 20 days before the notice and after.","民法典 §8204：初步通知须在首次提供工作后20天内送达。逾期送达的通知，只保护送达日前20天内及之后提供的工作。"],
 s:"California Civil Code §8204"},
{id:"LB-INS-03",ex:"LB",sec:"ins",
 q:["The owner records a valid Notice of Completion. Within how many days after recording must the DIRECT contractor record its mechanics lien?","业主登记了有效的完工通知（Notice of Completion），直接承包商（direct contractor）必须在登记后多少天内登记机械师留置权？"],
 o:[["60 days","60天"],["30 days","30天"],["90 days","90天"],["20 days","20天"]],
 e:["Civil Code §8412: a direct contractor must record its lien after completing its contract and before the earlier of 90 days after completion of the work of improvement, or 60 days after the owner records a notice of completion or cessation. Other claimants (subs, suppliers) get 30 days after a recorded notice (§8414).","民法典 §8412：直接承包商须在合同完成后、且在以下较早者之前登记：工程完工后90天，或业主登记完工/停工通知后60天。其他权利人（分包商、供应商）在通知登记后只有30天（§8414）。"],
 s:"California Civil Code §8412, §8414"},
{id:"LB-INS-04",ex:"LB",sec:"ins",
 q:["After recording a mechanics lien, within how many days must the claimant file a lawsuit to foreclose it, or the lien becomes unenforceable?","登记机械师留置权后，权利人须在多少天内提起止赎诉讼，否则留置权失效？"],
 o:[["90 days","90天"],["30 days","30天"],["1 year","1年"],["4 years","4年"]],
 e:["Civil Code §8460: the claimant must commence an action to enforce the lien within 90 days after recording it (unless the period is extended by a recorded credit extension).","民法典 §8460：权利人须在登记留置权后90天内起诉执行（除非登记了信用延期）。"],
 s:"California Civil Code §8460"},
{id:"LB-INS-05",ex:"LB",sec:"ins",
 q:["Which type of insurance covers a contractor's liability for bodily injury or property damage to third parties caused by its operations?","哪种保险承保承包商因施工造成第三方人身伤害或财产损失的责任？"],
 o:[["Commercial general liability (CGL)","商业综合责任险（CGL）"],["Workers' compensation","工伤保险"],["Builder's risk","建筑工程一切险（Builder's risk）"],["Contractor's license bond","执照保证金"]],
 e:["CGL insurance covers third-party bodily injury and property damage. Workers' comp covers the contractor's own employees. Builder's risk covers the structure under construction. The license bond protects the public, not the contractor.","CGL承保第三方人身伤害和财产损失；工伤险承保自家员工；Builder's risk承保在建工程本身；执照保证金保护的是公众而非承包商。"],
 s:"NASCLA Contractors Guide (insurance); B&P Code §7159.3 (CGL disclosure)"},
{id:"LB-INS-06",ex:"LB",sec:"ins",
 q:["An employee reports a work injury. Within what time must the employer provide the workers' compensation claim form (DWC-1)?","员工报告工伤后，雇主须在多长时间内提供工伤索赔表（DWC-1）？"],
 o:[["Within one working day of learning of the injury","知悉工伤后1个工作日内"],["Within 30 days","30天内"],["Only if the employee asks in writing","仅在员工书面要求时"],["Within 90 days","90天内"]],
 e:["Labor Code §5401 requires the employer to provide a claim form within one working day after receiving notice or knowledge of an injury that results in lost time beyond the date of injury or medical treatment beyond first aid.","劳动法典 §5401：雇主在得知导致误工或需超出急救范围治疗的工伤后，须在1个工作日内提供索赔表。"],
 s:"California Labor Code §5401"},
{id:"LB-INS-07",ex:"LB",sec:"ins",
 q:["A supplier who has not been paid on a PRIVATE project may protect itself by serving which document on the owner or construction lender to withhold funds?","私人工程中未获付款的供应商可向业主或建筑贷款方送达哪份文件，要求其扣留款项？"],
 o:[["Stop payment notice","止付通知（Stop payment notice）"],["Notice of completion","完工通知"],["Conditional waiver and release","有条件弃权与解除"],["Notice of cessation","停工通知"]],
 e:["A stop payment notice (Civil Code §8500 et seq.) directs the owner or lender to withhold funds to cover the claim. Notice of completion/cessation are owner documents; waivers release rights.","止付通知（民法典 §8500起）要求业主或贷款方扣留资金以覆盖索赔。完工/停工通知是业主文件；弃权书是放弃权利的文件。"],
 s:"California Civil Code §8500–8560"},
{id:"LB-INS-08",ex:"LB",sec:"ins",
 q:["Which statutory lien release form should a subcontractor sign when receiving a progress check that has NOT yet cleared the bank?","分包商收到尚未兑现的进度款支票时，应签署哪种法定留置权解除表？"],
 o:[["Conditional Waiver and Release on Progress Payment","进度款有条件弃权与解除"],["Unconditional Waiver and Release on Final Payment","最终款无条件弃权与解除"],["Unconditional Waiver and Release on Progress Payment","进度款无条件弃权与解除"],["Notice of Completion","完工通知"]],
 e:["Civil Code §8132–8138 provide four statutory forms. A conditional waiver is effective only when payment is actually received, so it is the safe form before funds clear. Unconditional forms should only be signed after payment is in hand.","民法典 §8132–8138 规定了四种法定格式。有条件弃权仅在实际收到款项后才生效，因此在款项到账前签署才安全；无条件弃权应在拿到钱后再签。"],
 s:"California Civil Code §8132–8138"},

// --- Contract Requirements and Execution (con) ---
{id:"LB-CON-01",ex:"LB",sec:"con",
 q:["On a home improvement contract, what is the maximum down payment a contractor may require?","家庭装修合同中，承包商可收取的最高首付款是多少？"],
 o:[["$1,000 or 10% of the contract price, whichever is less","1,000美元或合同价的10%，以较低者为准"],["10% of the contract price, no cap","合同价的10%，无上限"],["$1,000 or 10%, whichever is more","1,000美元或10%，以较高者为准"],["25% of the contract price","合同价的25%"]],
 e:["B&P Code §7159(d)(8): the down payment may not exceed $1,000 or 10% of the contract price (excluding finance charges), whichever is less. Swimming pools follow §7151.2 / §7159 rules as well.","B&P Code §7159(d)(8)：首付不得超过1,000美元或合同价（不含融资费用）的10%，以较低者为准。"],
 s:"B&P Code §7159; CSLB “Home Improvement Contracts” consumer guide"},
{id:"LB-CON-02",ex:"LB",sec:"con",
 q:["A homeowner aged 70 signs a home improvement contract in her home. How long does she have to cancel?","一位70岁的业主在家中签署了家庭装修合同，她有多长的取消期？"],
 o:[["5 business days","5个工作日"],["3 business days","3个工作日"],["7 calendar days","7个日历日"],["No right to cancel","无取消权"]],
 e:["The general three-business-day right to cancel is extended to five business days for buyers 65 or older (AB 2471, effective 2021; Civil Code §1689.5–1689.7; B&P §7159).","一般的3个工作日取消权，对65岁及以上的买方延长为5个工作日（AB 2471，2021年生效；民法典 §1689.5–1689.7；B&P §7159）。"],
 s:"CSLB Home Improvement Contracts consumer guide; Civil Code §1689.6; AB 2471 (2020)"},
{id:"LB-CON-03",ex:"LB",sec:"con",
 q:["A \"service and repair contract\" for work the homeowner requests (exempt from some home improvement contract rules) must have a total price for labor and materials under what amount?","业主主动请求的“维修服务合同”（可免除部分家装合同要求），人工加材料的总价必须低于多少？"],
 o:[["$750","750美元"],["$500","500美元"],["$1,000","1,000美元"],["$2,500","2,500美元"]],
 e:["B&P Code §7159.10 covers service and repair contracts; CSLB states the total contract price for labor and materials must be under $750, and the work must be initiated by the buyer. Above that, the full §7159 home improvement contract requirements apply.","B&P Code §7159.10 规定维修服务合同；CSLB说明人工加材料总价须低于750美元，且须由买方发起。超出则适用 §7159 全部家装合同要求。"],
 s:"B&P Code §7159.10; CSLB “Home Improvement Contracts: Warnings and Exceptions” page"},
{id:"LB-CON-04",ex:"LB",sec:"con",
 q:["Under a home improvement contract, progress payments may NOT exceed:","家装合同中，进度款不得超过："],
 o:[["The value of work performed or materials delivered","已完成工作或已交付材料的价值"],["50% of the contract price at any time","任何时候合同价的50%"],["The amount the lender approves","贷款方批准的金额"],["$1,000 per payment","每次1,000美元"]],
 e:["B&P Code §7159(d)(9)(B): a contractor may not request or accept payment that exceeds the value of the work performed or materials delivered, except for the allowed down payment.","B&P Code §7159(d)(9)(B)：除允许的首付外，承包商不得要求或接受超过已完成工作或已交付材料价值的款项。"],
 s:"B&P Code §7159(d)(9)"},
{id:"LB-CON-05",ex:"LB",sec:"con",
 q:["Under California's prompt payment statute, a prime contractor that receives a progress payment must pay each subcontractor its share within:","根据加州及时付款法，总承包商收到进度款后，须在多长时间内向各分包商支付其应得部分？"],
 o:[["7 days of receipt (unless otherwise agreed in writing)","收到后7天内（除非书面另有约定）"],["30 days","30天"],["10 business days after the job is complete","完工后10个工作日"],["60 days","60天"]],
 e:["B&P Code §7108.5 requires payment to subcontractors within 7 days of receipt of each progress payment, unless otherwise agreed in writing; violations bring a 2%-per-month penalty and possible discipline.","B&P Code §7108.5 要求在收到每笔进度款后7天内向分包商付款（书面另有约定除外）；违反者每月罚2%，并可能受纪律处分。"],
 s:"B&P Code §7108.5"},
{id:"LB-CON-06",ex:"LB",sec:"con",
 q:["What is the statute of limitations in California for a lawsuit based on a LATENT construction defect?","加州针对隐蔽（latent）施工缺陷的诉讼时效是多少年？"],
 o:[["10 years after substantial completion","实质完工后10年"],["4 years after substantial completion","实质完工后4年"],["2 years after discovery only","仅自发现起2年"],["1 year","1年"]],
 e:["CCP §337.15 sets a 10-year outer limit after substantial completion for latent defects; CCP §337.1 sets 4 years for patent (obvious) defects.","民事诉讼法 §337.15 规定隐蔽缺陷自实质完工起最长10年；§337.1 规定明显（patent）缺陷为4年。"],
 s:"California Code of Civil Procedure §337.1, §337.15"},
{id:"LB-CON-07",ex:"LB",sec:"con",
 q:["How should extra work or changes on a home improvement project be handled?","家装项目中的额外工作或变更应如何处理？"],
 o:[["By a written change order signed by both parties before the work is done","施工前由双方签署书面变更单"],["By verbal agreement, documented on the final invoice","口头约定，在最终发票上注明"],["Only by the building inspector's approval","只需建筑检查员批准"],["Changes are never allowed","不允许任何变更"]],
 e:["B&P Code §7159(d)(5) requires the contract to state that extra work and change orders must be in writing and signed by both parties before the work begins; failure is cause for discipline (§7159(e)).","B&P Code §7159(d)(5) 要求合同注明：额外工作和变更单须在开工前以书面形式由双方签署；未遵守可受纪律处分。"],
 s:"B&P Code §7159"},
{id:"LB-CON-08",ex:"LB",sec:"con",
 q:["A consumer may file a complaint with CSLB about a contractor's work. Generally, CSLB must file a disciplinary accusation within how many years of the act (10 years for latent structural defects)?","消费者可就承包商工程向CSLB投诉。一般情况下，CSLB须在违法行为发生后几年内提出纪律指控（隐蔽结构缺陷为10年）？"],
 o:[["4 years","4年"],["2 years","2年"],["1 year","1年"],["7 years","7年"]],
 e:["B&P Code §7091(a): accusations must be filed within 4 years after the act or omission; for latent structural defects, within 10 years.","B&P Code §7091(a)：指控须在行为或疏忽发生后4年内提出；隐蔽结构缺陷为10年内。"],
 s:"B&P Code §7091"},
{id:"LB-CON-09",ex:"LB",sec:"con",
 q:["In a lump-sum (stipulated sum) contract, who generally bears the risk of cost overruns?","总价包干合同（lump-sum）中，成本超支风险通常由谁承担？"],
 o:[["The contractor","承包商"],["The owner","业主"],["The architect","建筑师"],["The lender","贷款方"]],
 e:["In a lump-sum contract the contractor agrees to a fixed price, so overruns reduce its profit (absent approved changes). In cost-plus contracts more risk shifts to the owner.","总价包干合同中承包商同意固定价格，超支会侵蚀其利润（经批准的变更除外）；成本加酬金合同则更多风险转向业主。"],
 s:"NASCLA Contractors Guide (contract types)"},
{id:"LB-CON-10",ex:"LB",sec:"con",
 q:["In scheduling, the critical path is:","进度计划中，“关键路径”是指："],
 o:[["The longest sequence of dependent activities, which determines the shortest possible project duration","最长的依赖活动序列，决定项目最短工期"],["The list of the most expensive activities","费用最高的活动清单"],["Any activity with float","任何有浮动时间的活动"],["The inspector's route through the site","检查员在现场的行走路线"]],
 e:["Activities on the critical path have zero float; a delay to any of them delays project completion. That is why CPM scheduling focuses on them.","关键路径上的活动浮动时间为零，任何延误都会推迟完工，因此CPM进度法重点管理这些活动。"],
 s:"NASCLA Contractors Guide (project scheduling)"},
{id:"LB-CON-11",ex:"LB",sec:"con",
 q:["For home improvement contracts, the detailed §7159 contract requirements apply when the aggregate contract price exceeds:","家装合同在总价超过多少时，须满足 §7159 的详细合同要求？"],
 o:[["$500","500美元"],["$1,000","1,000美元"],["$750","750美元"],["$5,000","5,000美元"]],
 e:["B&P Code §7159(a) applies to home improvement contracts where the aggregate price for labor, materials and other items exceeds $500. (The separate minor-work licensing exemption in §7048 is $1,000 since 2025; these are different thresholds.)","B&P Code §7159(a) 适用于人工、材料等合计超过500美元的家装合同。（§7048 小型工程执照豁免自2025年起为1,000美元，两者是不同门槛，注意区分。）"],
 s:"B&P Code §7159(a); CSLB Home Improvement Contracts consumer guide (13P-045/1024)"},

{id:"LB-CON-12",ex:"LB",sec:"con",
 q:["Under AB 1327 (effective January 1, 2026), what must a home improvement contract now include, and how may the buyer cancel?","根据AB 1327（2026年1月1日生效），家装合同现在必须包含什么？买方可以用什么方式取消？"],
 o:[["The contractor's email address and phone number; the buyer may cancel by email","承包商的电子邮箱和电话；买方可通过电子邮件取消"],["The contractor's home address; cancellation only by certified mail","承包商住址；只能用挂号信取消"],["A notary stamp; cancellation only in person","公证章；只能当面取消"],["Nothing new; cancellation must be by fax","无新要求；只能传真取消"]],
 e:["CSLB's 2026 new-laws bulletin: home improvement contracts must include the contractor's email address and a telephone number, and buyers may cancel by email. The cancellation periods themselves (3 business days, 5 for buyers 65+) are unchanged.","CSLB 2026年新法公告：家装合同须写明承包商的电子邮箱和电话，买方可通过电子邮件取消。取消期本身（3个工作日，65岁以上5个工作日）不变。"],
 s:"AB 1327 (2025); CSLB Industry Bulletin #25-04 “New Laws Affecting Contractors Starting in 2026”"},
{id:"LB-CON-13",ex:"LB",sec:"con",
 q:["Under SB 517 (effective January 1, 2026), if a homeowner asks, a home improvement contractor must disclose what about its subcontractors?","根据SB 517（2026年1月1日生效），业主询问时，家装承包商必须披露分包商的哪些信息？"],
 o:[["Name, contact information, license number and classification","名称、联系方式、执照号码和执照类别"],["Their profit margin","利润率"],["Their employees' home addresses","员工住址"],["Nothing; subcontractor information is confidential","无需披露，分包商信息保密"]],
 e:["SB 517 requires home improvement contractors to provide, upon request, each subcontractor's name, contact information, license number and classification. Subcontractors and home improvement salespersons can also be disciplined for violations.","SB 517 要求家装承包商应要求提供每个分包商的名称、联系方式、执照号码和类别。分包商和家装销售人员违规也可受处分。"],
 s:"SB 517 (2025); CSLB Industry Bulletin #25-04"},
{id:"LB-ORG-11",ex:"LB",sec:"org",
 q:["Under SB 779, starting July 1, 2026, what is the minimum CSLB civil penalty (citation fine) for unlicensed contracting activity?","根据SB 779，自2026年7月1日起，CSLB对无照施工的最低民事罚款是多少？"],
 o:[["$1,500","1,500美元"],["$200","200美元"],["$100","100美元"],["$50,000","50,000美元"]],
 e:["SB 779 raised minimum civil penalties effective July 1, 2026: fines for unlicensed activity start at $1,500 (previously $200); other violations carry minimums of $500 or $1,500, adjusted for inflation every five years. This is separate from the criminal penalties in B&P §7028.","SB 779 自2026年7月1日起提高最低民事罚款：无照施工最低1,500美元（此前为200美元）；其他违规最低500或1,500美元，每五年按通胀调整。这与 B&P §7028 的刑事处罚是两回事。"],
 s:"SB 779 (2025); CSLB Industry Bulletin #25-04"},
// --- Public Works (pub) ---
{id:"LB-PUB-01",ex:"LB",sec:"pub",
 q:["Generally, California prevailing wage requirements apply to public works projects over what amount?","一般情况下，加州现行工资（prevailing wage）要求适用于金额超过多少的公共工程？"],
 o:[["$1,000","1,000美元"],["$25,000","25,000美元"],["$100,000","100,000美元"],["All projects of any size","任何金额的项目"]],
 e:["Labor Code §1771 requires prevailing wages on public works over $1,000 (other thresholds apply to certain maintenance and to awarding bodies with labor compliance programs).","劳动法典 §1771 要求超过1,000美元的公共工程支付现行工资（部分维护工程等另有门槛）。"],
 s:"California Labor Code §1771; DIR Public Works Manual"},
{id:"LB-PUB-02",ex:"LB",sec:"pub",
 q:["Before bidding on or performing California public works, a contractor or subcontractor must generally:","在投标或承接加州公共工程之前，承包商或分包商一般必须："],
 o:[["Register with the Department of Industrial Relations (DIR)","在劳资关系部（DIR）注册"],["Obtain a federal contractor ID","取得联邦承包商ID"],["Join a labor union","加入工会"],["Post a $1,000,000 bid bond","提交100万美元投标保证金"]],
 e:["Labor Code §1725.5 requires contractors and subcontractors to register annually with DIR to bid on or perform public works (with small-project exceptions).","劳动法典 §1725.5 要求承包商及分包商每年在DIR注册才可投标或承接公共工程（小型项目有例外）。"],
 s:"California Labor Code §1725.5; DIR Public Works Manual"},
{id:"LB-PUB-03",ex:"LB",sec:"pub",
 q:["On a California public works contract over $25,000, the prime contractor must provide which bond before work begins?","加州超过25,000美元的公共工程合同，总承包商开工前必须提供哪种保证金？"],
 o:[["A payment bond","付款保证金（Payment bond）"],["A license bond only","仅执照保证金"],["A fidelity bond","忠诚保证金"],["No bond is required","无需保证金"]],
 e:["Civil Code §9550 requires a payment bond for public works contracts over $25,000, protecting subcontractors, suppliers and workers who cannot lien public property.","民法典 §9550 要求超过25,000美元的公共工程提供付款保证金，以保护无法对公共财产行使留置权的分包商、供应商和工人。"],
 s:"California Civil Code §9550"},
{id:"LB-PUB-04",ex:"LB",sec:"pub",
 q:["On California public works, contractors must keep what payroll record for each worker?","加州公共工程中，承包商须为每位工人保存哪种工资记录？"],
 o:[["Certified payroll records","经认证的工资记录（Certified payroll）"],["Only the W-2","只要W-2"],["Daily photographs","每日照片"],["No special records","无特殊要求"]],
 e:["Labor Code §1776 requires each contractor and subcontractor to keep accurate certified payroll records showing name, classification, hours and wages for each worker, and most must be submitted electronically to DIR.","劳动法典 §1776 要求承包商和分包商为每位工人保存准确的认证工资记录（姓名、工种、工时、工资），大多数须电子提交DIR。"],
 s:"California Labor Code §1776; DIR Public Works Manual"},

// --- Safety (saf) ---
{id:"LB-SAF-01",ex:"LB",sec:"saf",
 q:["Every California employer must establish, implement and maintain a written:","每个加州雇主都必须建立、执行并维护一份书面的："],
 o:[["Injury and Illness Prevention Program (IIPP)","伤害与疾病预防计划（IIPP）"],["Employee stock plan","员工持股计划"],["Union agreement","工会协议"],["Marketing plan","营销计划"]],
 e:["Labor Code §6401.7 and Title 8 CCR §3203 require every employer to have an effective written IIPP. In construction, §1509 also requires it.","劳动法典 §6401.7 与《加州法规》第8编 §3203 要求每个雇主制定有效的书面IIPP；建筑业另见 §1509。"],
 s:"Labor Code §6401.7; 8 CCR §3203, §1509"},
{id:"LB-SAF-02",ex:"LB",sec:"saf",
 q:["An employee suffers a serious injury on the job. Within how many hours must the employer report it to Cal/OSHA?","员工在工作中受重伤，雇主须在几小时内向Cal/OSHA报告？"],
 o:[["8 hours","8小时"],["24 hours","24小时"],["72 hours","72小时"],["5 days","5天"]],
 e:["8 CCR §342(a) requires immediate reporting—no later than 8 hours after the employer knows or should have known—of any serious injury, illness or death.","8 CCR §342(a) 要求在雇主知道或应当知道后立即（最迟8小时内）报告严重伤害、疾病或死亡。"],
 s:"8 CCR §342; Labor Code §6409.1"},
{id:"LB-SAF-03",ex:"LB",sec:"saf",
 q:["Under Cal/OSHA Construction Safety Orders, how often must supervisors hold \"toolbox\" or \"tailgate\" safety meetings?","根据Cal/OSHA建筑安全令，主管须多久召开一次“工具箱/尾板”安全会议？"],
 o:[["At least every 10 working days","至少每10个工作日"],["Once a month","每月一次"],["Once a year","每年一次"],["Only after an accident","仅在事故后"]],
 e:["8 CCR §1509(e) requires supervisory employees to conduct toolbox or tailgate safety meetings with their crews at least every 10 working days.","8 CCR §1509(e) 要求主管至少每10个工作日与班组召开一次工具箱或尾板安全会议。"],
 s:"8 CCR §1509(e)"},
{id:"LB-SAF-04",ex:"LB",sec:"saf",
 q:["Before employees enter a trench 5 feet or deeper, the employer generally must:","员工进入5英尺或更深的沟槽前，雇主一般必须："],
 o:[["Obtain an annual Cal/OSHA permit and provide a protective system","取得Cal/OSHA年度许可，并设置保护系统"],["Notify the homeowner only","只需通知业主"],["Do nothing special if the soil is dry","若土壤干燥则无需特殊措施"],["Use a ladder only","只要放梯子即可"]],
 e:["Labor Code §6500 and 8 CCR §341 require a Cal/OSHA permit for trenches/excavations 5 feet or deeper into which a person is required to descend; 8 CCR §1541.1 requires protective systems (sloping, shoring or shielding) for excavations 5 feet or deeper unless in stable rock.","劳动法典 §6500 与 8 CCR §341 要求对需要人员下到5英尺或更深的沟槽/开挖取得Cal/OSHA许可；8 CCR §1541.1 要求5英尺及以上开挖设置保护系统（放坡、支撑或防护箱），稳定岩层除外。"],
 s:"Labor Code §6500; 8 CCR §341, §1541.1"},
{id:"LB-SAF-05",ex:"LB",sec:"saf",
 q:["Employers must make which documents readily accessible to employees who work with hazardous chemicals?","对接触危险化学品的员工，雇主必须让其能随时查阅哪些文件？"],
 o:[["Safety Data Sheets (SDS)","安全数据表（SDS）"],["Purchase orders","采购订单"],["Tax returns","纳税申报表"],["Bid documents","投标文件"]],
 e:["The Hazard Communication standard (8 CCR §5194) requires labels, SDSs and training; SDSs must be readily accessible during each work shift.","危害告知标准（8 CCR §5194）要求标签、SDS和培训；SDS须在每个班次中随时可查。"],
 s:"8 CCR §5194"},
{id:"LB-SAF-06",ex:"LB",sec:"saf",
 q:["Renovation work that disturbs painted surfaces in a home built before which year is subject to the EPA Lead Renovation, Repair and Painting (RRP) rule?","在哪一年之前建造的住宅中扰动油漆表面，须遵守EPA铅翻新维修涂装（RRP）规定？"],
 o:[["1978","1978年"],["1990","1990年"],["1960","1960年"],["2000","2000年"]],
 e:["The EPA RRP rule (40 CFR Part 745, Subpart E) applies to target housing built before 1978; firms must be EPA-certified and use lead-safe work practices.","EPA的RRP规定（40 CFR Part 745 Subpart E）适用于1978年之前建造的目标住宅；施工企业须取得EPA认证并采用铅安全作业方法。"],
 s:"40 CFR Part 745, Subpart E"},
{id:"LB-SAF-07",ex:"LB",sec:"saf",
 q:["A Code of Safe Practices must be:","安全作业守则（Code of Safe Practices）必须："],
 o:[["Posted at a conspicuous location at each job site","张贴在每个工地的显眼位置"],["Kept only at the main office","只保存在总部办公室"],["Filed with CSLB annually","每年向CSLB备案"],["Given only to supervisors","只发给主管"]],
 e:["8 CCR §1509(b)-(c) requires employers to adopt a written Code of Safe Practices relating to their operations and post it at a conspicuous location at each job site office or provide it to each supervisor who must keep it at the site.","8 CCR §1509(b)-(c) 要求雇主制定书面安全作业守则，并张贴在每个工地办公室的显眼位置，或交给主管在现场保存。"],
 s:"8 CCR §1509"},

// ===================== B — GENERAL BUILDING TRADE =====================
// --- Planning and Estimating (plan) ---
{id:"B-PLAN-01",ex:"B",sec:"plan",
 q:["How many cubic yards of concrete are needed for a 30 ft × 40 ft slab, 4 inches thick (no waste)?","一块30英尺×40英尺、厚4英寸的楼板需要多少立方码混凝土（不计损耗）？"],
 o:[["About 14.8 cubic yards","约14.8立方码"],["About 44.4 cubic yards","约44.4立方码"],["About 400 cubic yards","约400立方码"],["About 4.4 cubic yards","约4.4立方码"]],
 e:["30 × 40 × (4/12) = 400 cubic feet. 400 ÷ 27 = 14.81 cubic yards. Remember: 1 cubic yard = 27 cubic feet; in practice add a waste allowance.","30 × 40 × (4/12) = 400立方英尺；400 ÷ 27 = 14.81立方码。记住：1立方码 = 27立方英尺；实际下单要加损耗。"],
 s:"Standard unit conversion; Fundamentals of Building Construction (CSLB B reference list)"},
{id:"B-PLAN-02",ex:"B",sec:"plan",
 q:["How many board feet are in one 2×6 that is 12 feet long (nominal dimensions)?","一根12英尺长的2×6木料（名义尺寸）有多少板英尺（board feet）？"],
 o:[["12 board feet","12板英尺"],["6 board feet","6板英尺"],["24 board feet","24板英尺"],["144 board feet","144板英尺"]],
 e:["Board feet = thickness (in) × width (in) × length (ft) ÷ 12 = 2 × 6 × 12 ÷ 12 = 12 BF.","板英尺 = 厚（英寸）× 宽（英寸）× 长（英尺）÷ 12 = 2 × 6 × 12 ÷ 12 = 12。"],
 s:"Modern Carpentry (Goodheart-Willcox) — lumber measurement"},
{id:"B-PLAN-03",ex:"B",sec:"plan",
 q:["A 20-foot wall has studs at 16 inches on center. How many studs are needed for the run (ignoring corners, openings and plates)?","一面20英尺长的墙，立柱间距16英寸（中到中），不计转角、开口和顶底板，需要多少根立柱？"],
 o:[["16","16根"],["15","15根"],["20","20根"],["13","13根"]],
 e:["20 ft × 12 = 240 in; 240 ÷ 16 = 15 spaces; add 1 for the end stud = 16 studs.","20英尺 × 12 = 240英寸；240 ÷ 16 = 15个间隔；加上末端1根 = 16根。"],
 s:"Modern Carpentry — wall framing layout"},
{id:"B-PLAN-04",ex:"B",sec:"plan",
 q:["Which document normally governs if the written specifications and the drawings conflict, unless the contract states otherwise?","若书面规范与图纸冲突且合同未另行约定，通常以哪个为准？"],
 o:[["The specifications","规范（Specifications）"],["The drawings","图纸"],["Whatever is cheaper for the contractor","对承包商更便宜的那个"],["The subcontractor's shop drawing","分包商的深化图"]],
 e:["Common contract practice (e.g., many general conditions) gives written specifications precedence over drawings, and larger-scale details over smaller-scale ones. Always check the order-of-precedence clause in the actual contract and submit an RFI.","常见合同惯例（如多数通用条款）规定书面规范优先于图纸，大比例详图优先于小比例图。实际以合同中的优先顺序条款为准，并应提交RFI确认。"],
 s:"Olin's Construction (CSLB B reference list) — contract documents; NASCLA Contractors Guide"},
{id:"B-PLAN-05",ex:"B",sec:"plan",
 q:["What is the purpose of shop drawings?","深化图（Shop drawings）的用途是什么？"],
 o:[["To show how a fabricator or subcontractor will build or install specific components, for review against the design","展示制造商或分包商将如何制作或安装特定构件，供对照设计审核"],["To replace the architect's drawings","取代建筑师的图纸"],["To obtain the building permit","用于申请建筑许可"],["To record the final as-built conditions","记录最终竣工状况"]],
 e:["Shop drawings are prepared by the contractor, sub or supplier (e.g., trusses, cabinets, steel) and submitted for the design professional's review. As-built drawings record final conditions.","深化图由承包商、分包商或供应商编制（如桁架、橱柜、钢结构），提交设计方审核。竣工图（as-built）记录最终状况。"],
 s:"Olin's Construction — submittals; Fundamentals of Building Construction"},
{id:"B-PLAN-06",ex:"B",sec:"plan",
 q:["How many square feet does one standard 4 ft × 8 ft sheet of drywall cover?","一张标准4英尺×8英尺石膏板覆盖多少平方英尺？"],
 o:[["32 sq ft","32平方英尺"],["48 sq ft","48平方英尺"],["24 sq ft","24平方英尺"],["64 sq ft","64平方英尺"]],
 e:["4 × 8 = 32 square feet. Estimators divide net wall/ceiling area by sheet area and then add waste.","4 × 8 = 32平方英尺。估算时用净墙/顶面积除以单张面积，再加损耗。"],
 s:"Standard estimating arithmetic"},
{id:"B-PLAN-07",ex:"B",sec:"plan",
 q:["Before excavating, a contractor must contact the regional notification center (811 / DigAlert) at least how long before starting?","开挖前，承包商须至少提前多久联系区域通知中心（811/DigAlert）？"],
 o:[["2 working days (not counting the day of notification)","2个工作日（不含通知当天）"],["2 hours","2小时"],["2 weeks","2周"],["Only if digging deeper than 5 feet","仅当挖深超过5英尺时"]],
 e:["Government Code §4216.2 requires an excavator to contact the regional notification center at least two working days, but not more than 14 calendar days, before beginning excavation.","政府法典 §4216.2 要求开挖者在开挖前至少2个工作日、但不超过14个日历日联系区域通知中心。"],
 s:"California Government Code §4216.2"},

// --- Framing and Structural Components (frame) ---
{id:"B-FRM-01",ex:"B",sec:"frame",
 q:["Under the California Residential Code, notches in solid sawn floor joists may not exceed what fraction of the joist depth, and may not be located in the middle third of the span?","根据加州住宅规范，实木楼板格栅上的开槽不得超过格栅高度的几分之几，且不得位于跨度中间三分之一？"],
 o:[["One-sixth","六分之一"],["One-third","三分之一"],["One-half","二分之一"],["One-quarter","四分之一"]],
 e:["CRC §R502: notches may not exceed 1/6 of joist depth, not be longer than 1/3 of depth, and not be in the middle third of the span (end notches max 1/4 depth). Bored holes may not exceed 1/3 of depth and must be at least 2 in. from top or bottom edges.","CRC §R502：开槽不得超过格栅高度的1/6，长度不超过高度的1/3，且不得位于跨中三分之一（端部开槽不超过1/4）。钻孔直径不超过高度的1/3，距上下边缘至少2英寸。"],
 s:"2025 California Residential Code §R502"},
{id:"B-FRM-02",ex:"B",sec:"frame",
 q:["In an exterior or bearing wall, a stud may be notched to a depth not exceeding what percentage of its width?","外墙或承重墙中，立柱的开槽深度不得超过其宽度的多少？"],
 o:[["25%","25%"],["40%","40%"],["60%","60%"],["10%","10%"]],
 e:["CRC §R602: in exterior and bearing walls, notches may not exceed 25% of stud width; bored holes may not exceed 40% (up to 60% if the stud is doubled and not more than two successive studs are bored). Nonbearing partitions allow 40% notching.","CRC §R602：外墙与承重墙立柱开槽不超过宽度25%；钻孔不超过40%（若立柱加倍且连续不超过两根，可达60%）。非承重隔墙开槽可达40%。"],
 s:"2025 California Residential Code §R602"},
{id:"B-FRM-03",ex:"B",sec:"frame",
 q:["In the CRC prescriptive method, foundation anchor bolts securing the sill plate must be at least what diameter, embedded at least how deep, at maximum what spacing?","CRC规范性方法中，固定地梁板的锚栓最小直径、最小埋深、最大间距分别是多少？"],
 o:[["1/2 inch; 7 inches; 6 feet on center","1/2英寸；7英寸；中距6英尺"],["3/8 inch; 4 inches; 8 feet on center","3/8英寸；4英寸；中距8英尺"],["5/8 inch; 12 inches; 10 feet on center","5/8英寸；12英寸；中距10英尺"],["1/4 inch; 3 inches; 4 feet on center","1/4英寸；3英寸；中距4英尺"]],
 e:["CRC §R403: anchor bolts at least 1/2 in. diameter, embedded at least 7 in. into concrete or grouted masonry, spaced not more than 6 ft o.c., with a bolt within 12 in. of each end of each plate section (minimum two bolts per section). Higher seismic design categories add requirements such as plate washers (§R602).","CRC §R403：锚栓直径≥1/2英寸，埋入混凝土或灌浆砌体≥7英寸，中距≤6英尺，每段地梁板两端12英寸内各有一根（每段至少两根）。高抗震设计类别另有要求，如方形垫板（§R602）。"],
 s:"2025 California Residential Code §R403, §R602"},
{id:"B-FRM-04",ex:"B",sec:"frame",
 q:["What is the primary function of a hold-down connector at the end of a shear wall?","剪力墙端部的抗拔件（hold-down）主要作用是什么？"],
 o:[["Resist uplift (overturning) forces and transfer them to the foundation","抵抗上拔（倾覆）力并传递至基础"],["Support the roof's vertical dead load","承受屋顶竖向恒载"],["Provide fireblocking","起防火隔断作用"],["Prevent moisture wicking into the stud","防止水分渗入立柱"]],
 e:["Lateral seismic or wind forces on a shear wall create an overturning moment, pulling one end up. Hold-downs tie the end posts to the foundation to complete the load path.","地震或风的水平力作用于剪力墙会产生倾覆力矩，使一端上拔。抗拔件把端柱与基础连接，形成完整传力路径。"],
 s:"Fundamentals of Building Construction (Allen & Iano); CRC §R602"},
{id:"B-FRM-05",ex:"B",sec:"frame",
 q:["Wood sill plates resting directly on a concrete foundation must be:","直接放在混凝土基础上的木地梁板必须是："],
 o:[["Naturally durable or preservative-treated wood","天然耐久木材或防腐处理木材"],["Kiln-dried Douglas fir only","只能是窑干花旗松"],["Finger-jointed studs","指接木"],["Engineered I-joists","工程I型格栅"]],
 e:["CRC R304 requires protection against decay for sills and sleepers on concrete or masonry in direct contact with the ground, using naturally durable or preservative-treated wood.","CRC R304 要求与地面直接接触的混凝土或砌体上的地梁及枕木须防腐，使用天然耐久或防腐处理木材。"],
 s:"2025 California Residential Code R304"},
{id:"B-FRM-06",ex:"B",sec:"frame",
 q:["Under the CRC, what is the maximum riser height and minimum tread depth for a residential stairway?","根据CRC，住宅楼梯踏步的最大踢面高度和最小踏面深度分别是多少？"],
 o:[["7-3/4 inches maximum riser; 10 inches minimum tread","踢面最高7-3/4英寸；踏面最小10英寸"],["7 inches maximum riser; 11 inches minimum tread","踢面最高7英寸；踏面最小11英寸"],["8-1/4 inches maximum riser; 9 inches minimum tread","踢面最高8-1/4英寸；踏面最小9英寸"],["6 inches maximum riser; 12 inches minimum tread","踢面最高6英寸；踏面最小12英寸"]],
 e:["CRC R318.7 limits risers to 7-3/4 in.; R318.7 requires treads of at least 10 in. The difference between largest and smallest riser or tread in a flight may not exceed 3/8 in. (The 7 in./11 in. figures are typical of the CBC for other occupancies.)","CRC R318.7 规定踢面不超过7-3/4英寸；R318.7 规定踏面不少于10英寸。同一梯段最大与最小踢面或踏面之差不超过3/8英寸。（7英寸/11英寸是CBC对其他用途建筑的典型要求。）"],
 s:"2025 California Residential Code R318.7"},
{id:"B-FRM-07",ex:"B",sec:"frame",
 q:["Under the CRC, handrails on residential stairs must be installed at what height, measured vertically from the sloped plane of the tread nosings?","根据CRC，住宅楼梯扶手高度（从踏面前缘连线垂直量起）应为多少？"],
 o:[["34 to 38 inches","34至38英寸"],["30 to 34 inches","30至34英寸"],["36 to 42 inches","36至42英寸"],["42 inches minimum","至少42英寸"]],
 e:["CRC R320 requires handrail height of not less than 34 in. and not more than 38 in. above the tread nosings.","CRC R320 规定扶手高度不低于34英寸、不高于38英寸（自踏面前缘量起）。"],
 s:"2025 California Residential Code R320"},
{id:"B-FRM-08",ex:"B",sec:"frame",
 q:["Under the 2025 California Residential Code, guards are required where a walking surface is more than 30 inches above the floor or grade below (within 36 inches horizontally). What is the minimum guard height on a deck or balcony?","根据2025版加州住宅规范，步行面高出下方地面30英寸以上（水平36英寸范围内）须设护栏。平台或阳台护栏的最小高度是多少？"],
 o:[["42 inches","42英寸"],["36 inches","36英寸"],["34 inches","34英寸"],["30 inches","30英寸"]],
 e:["CRC R321.1.1 sets the 30-in. trigger; California's CRC R321.1.2 requires guards not less than 42 in. high (the national IRC uses 36 in. — a common trap). On the open sides of stairs a guard may be 34 in. measured from the nosing line. Openings may not pass a 4-in. sphere (R321.1.3).","CRC R321.1.1 规定30英寸的设置门槛；加州CRC R321.1.2 要求护栏高度不低于42英寸（全国通用的IRC是36英寸，这是常见陷阱）。楼梯开敞侧护栏可为34英寸（从踏面前缘连线量起）。栏杆间隙不得让4英寸球体通过（R321.1.3）。"],
 s:"2025 California Residential Code R321.1 (Guards; CA amendment 42 in.)"},
{id:"B-FRM-09",ex:"B",sec:"frame",
 q:["Exterior three-coat stucco is applied in what order?","外墙三道抹灰（stucco）的施工顺序是？"],
 o:[["Scratch coat, brown coat, finish coat","刮糙层（scratch）、找平层（brown）、面层（finish）"],["Brown coat, scratch coat, finish coat","找平层、刮糙层、面层"],["Finish coat, brown coat, scratch coat","面层、找平层、刮糙层"],["Primer, scratch coat, paint","底漆、刮糙层、涂料"]],
 e:["Portland cement plaster over lath is applied as scratch coat (scored to bond), brown coat (leveling), then finish coat (CRC §R703 referencing ASTM C926).","水泥抹灰在网片上按刮糙层（划毛以利粘结）、找平层、面层施工（CRC §R703 引用 ASTM C926）。"],
 s:"2025 California Residential Code §R703; ASTM C926"},
{id:"B-FRM-10",ex:"B",sec:"frame",
 q:["A foundation weep screed for exterior stucco must be placed at least how far above the earth (or above paved areas)?","外墙抹灰的基础泄水条（weep screed）至少应高于泥土地面（或铺装地面）多少？"],
 o:[["4 inches above earth or 2 inches above paved areas","高于泥土地面4英寸或铺装面2英寸"],["1 inch above earth","高于泥土地面1英寸"],["12 inches above earth","高于泥土地面12英寸"],["Flush with the grade","与地面齐平"]],
 e:["CRC §R703: the weep screed is placed at least 4 in. above the earth or 2 in. above paved areas, at or below the foundation plate line on exterior stud walls.","CRC §R703：泄水条至少高于泥土地面4英寸或铺装面2英寸，位于外墙立柱地梁线或以下。"],
 s:"2025 California Residential Code §R703"},

// --- Core Trades (core) ---
{id:"B-CORE-01",ex:"B",sec:"core",
 q:["Concrete compressive strength (f'c) used in design is typically specified at what age?","设计中采用的混凝土抗压强度（f'c）通常按几天龄期规定？"],
 o:[["28 days","28天"],["7 days","7天"],["3 days","3天"],["90 days","90天"]],
 e:["Specified compressive strength is normally the 28-day strength of standard test cylinders (ACI 318). 7-day tests are often used as an early indicator.","规定的抗压强度通常为标准试件28天强度（ACI 318）。7天试验常作为早期参考。"],
 s:"ACI 318; Fundamentals of Building Construction (concrete chapter)"},
{id:"B-CORE-02",ex:"B",sec:"core",
 q:["Adding extra water to a concrete mix at the site to make it easier to place will:","在现场向混凝土中多加水以便浇筑，会导致："],
 o:[["Increase slump but reduce strength and durability","坍落度增大，但强度和耐久性下降"],["Increase both slump and strength","坍落度和强度都提高"],["Have no effect on strength","对强度没有影响"],["Reduce slump and increase strength","坍落度减小、强度提高"]],
 e:["Strength depends mainly on the water-cement ratio. More water raises the ratio, increasing workability (slump) but reducing strength and increasing shrinkage and permeability.","强度主要取决于水灰比。加水提高水灰比，和易性（坍落度）增加，但强度降低、收缩和渗透性增加。"],
 s:"Fundamentals of Building Construction (Allen & Iano) — concrete"},
{id:"B-CORE-03",ex:"B",sec:"core",
 q:["The slump test (ASTM C143) measures a fresh concrete's:","坍落度试验（ASTM C143）测量新拌混凝土的："],
 o:[["Consistency / workability","稠度/和易性"],["Compressive strength","抗压强度"],["Air content","含气量"],["Temperature","温度"]],
 e:["The slump cone test measures how much a cone of fresh concrete settles, indicating consistency. Strength is measured with cylinders; air content with a pressure or volumetric meter.","坍落度试验测量新拌混凝土锥体的下沉量，反映稠度。强度用圆柱试件测，含气量用压力法或体积法测。"],
 s:"ASTM C143; Fundamentals of Building Construction"},
{id:"B-CORE-04",ex:"B",sec:"core",
 q:["For cast-in-place concrete cast against and permanently exposed to earth, the minimum concrete cover over reinforcing steel is:","直接浇筑在泥土上并永久接触土壤的现浇混凝土，钢筋最小保护层厚度为："],
 o:[["3 inches","3英寸"],["1-1/2 inches","1-1/2英寸"],["3/4 inch","3/4英寸"],["6 inches","6英寸"]],
 e:["ACI 318 (adopted through the CBC) requires 3 in. of cover for nonprestressed cast-in-place concrete cast against and permanently in contact with ground. Concrete exposed to earth or weather but formed requires 1-1/2 to 2 in. depending on bar size.","ACI 318（经CBC采用）规定：直接浇筑于土上并永久接触土壤的普通现浇混凝土保护层3英寸；接触土壤或天气但有模板成型的，按钢筋尺寸为1-1/2至2英寸。"],
 s:"ACI 318 Table 20.5.1.3.1 (via 2025 CBC Ch. 19)"},
{id:"B-CORE-05",ex:"B",sec:"core",
 q:["Under the CRC, exterior footings must extend at least how far below undisturbed ground surface?","根据CRC，外墙基础底面至少应低于原状土地面多少？"],
 o:[["12 inches","12英寸"],["6 inches","6英寸"],["24 inches","24英寸"],["36 inches","36英寸"]],
 e:["CRC §R403: all exterior footings must be placed at least 12 in. below the undisturbed ground surface (deeper where the frost line or local requirements demand).","CRC §R403：所有外墙基础底面至少位于原状土面以下12英寸（冻土线或地方规定更深者从其规定）。"],
 s:"2025 California Residential Code §R403"},
{id:"B-CORE-06",ex:"B",sec:"core",
 q:["Under the CRC, what vapor retarder is required between a concrete floor slab and the base course in conditioned spaces (unless excepted)?","根据CRC，空调空间混凝土楼板与基层之间（无例外时）须设置什么防潮层？"],
 o:[["6-mil (0.006 in.) polyethylene or approved equivalent","6密尔（0.006英寸）聚乙烯膜或认可同等材料"],["15-lb felt paper","15磅油毡"],["1/2-inch plywood","1/2英寸胶合板"],["No vapor retarder","不需要防潮层"]],
 e:["CRC R506.3.3 requires a 6-mil polyethylene or approved vapor retarder with joints lapped at least 6 in. (The 2025 edition returned this to 6 mil from the 10 mil required in the prior California edition.)","CRC R506.3.3 要求6密尔聚乙烯或认可防潮层，接缝搭接至少6英寸。（2025版已从上一版加州规范的10密尔改回6密尔。）"],
 s:"2025 California Residential Code R506.3.3; 2025 CRC significant-changes summary"},
{id:"B-CORE-07",ex:"B",sec:"core",
 q:["Under the California Electrical Code, which of these dwelling locations requires GFCI protection for 125-volt, 15- and 20-ampere receptacles?","根据加州电气规范，住宅以下哪个位置的125V、15A/20A插座需要GFCI保护？"],
 o:[["Bathrooms","浴室"],["Bedrooms only","仅卧室"],["Hallway ceiling lights","走廊吸顶灯"],["None; GFCI is optional","没有，GFCI是可选的"]],
 e:["CEC 210.8(A) requires GFCI protection in dwelling bathrooms, garages, outdoors, crawl spaces, basements, kitchens, laundry areas, and within 6 ft of sinks, among others. Bedrooms are a primary AFCI location (210.12).","CEC 210.8(A) 要求住宅浴室、车库、室外、爬行空间、地下室、厨房、洗衣区及水槽6英尺内等处设GFCI保护。卧室主要是AFCI要求（210.12）。"],
 s:"2025 California Electrical Code 210.8(A), 210.12"},
{id:"B-CORE-08",ex:"B",sec:"core",
 q:["In a dwelling kitchen, how many 20-ampere small-appliance branch circuits are required at minimum for the countertop receptacles?","住宅厨房台面插座至少需要几个20安培小家电分支电路？"],
 o:[["Two","两个"],["One","一个"],["Three","三个"],["Four","四个"]],
 e:["CEC 210.11(C)(1) and 210.52(B) require at least two 20-ampere small-appliance branch circuits to serve kitchen countertop receptacles.","CEC 210.11(C)(1) 与 210.52(B) 要求至少两个20安培小家电分支电路为厨房台面插座供电。"],
 s:"2025 California Electrical Code 210.11(C)(1), 210.52(B)"},
{id:"B-CORE-09",ex:"B",sec:"core",
 q:["Under the California Plumbing Code, a fixture trap seal must be:","根据加州管道规范，存水弯（trap）水封深度应为："],
 o:[["Not less than 2 inches and not more than 4 inches","不小于2英寸、不大于4英寸"],["Not less than 1/2 inch","不小于1/2英寸"],["Exactly 6 inches","正好6英寸"],["Not more than 1 inch","不超过1英寸"]],
 e:["CPC §1005.1: each fixture trap shall have a liquid seal of not less than 2 in. and not more than 4 in. (deeper allowed in special cases such as interceptors).","CPC §1005.1：每个卫生器具存水弯水封不小于2英寸、不大于4英寸（隔油器等特殊情况可更深）。"],
 s:"2025 California Plumbing Code §1005.1"},
{id:"B-CORE-10",ex:"B",sec:"core",
 q:["What is the standard minimum slope for horizontal drainage piping 3 inches and smaller under the California Plumbing Code?","根据加州管道规范，3英寸及以下水平排水管的标准最小坡度是多少？"],
 o:[["1/4 inch per foot","每英尺1/4英寸"],["1/8 inch per foot","每英尺1/8英寸"],["1/2 inch per foot","每英尺1/2英寸"],["1 inch per foot","每英尺1英寸"]],
 e:["CPC §708.1 requires horizontal drainage piping to run at a uniform slope of not less than 1/4 in. per foot; where impracticable, 4-in. and larger pipe may be approved at 1/8 in. per foot.","CPC §708.1 要求水平排水管均匀坡度不小于每英尺1/4英寸；不可行时，4英寸及以上管道经批准可用1/8英寸。"],
 s:"2025 California Plumbing Code §708.1"},
{id:"B-CORE-11",ex:"B",sec:"core",
 q:["How must a residential water heater be braced against earthquake motion under the CPC?","根据CPC，住宅热水器应如何进行抗震固定？"],
 o:[["Strapped in the upper third and lower third of its vertical dimension, lower strap at least 4 in. above the controls","在竖向高度上三分之一和下三分之一处各绑一道，下绑带距控制器至少4英寸"],["One strap at the very top only","仅在最顶部绑一道"],["Bolted to the floor only","仅用螺栓固定于地面"],["No bracing is needed indoors","室内无需固定"]],
 e:["CPC §507.2: water heaters shall be anchored or strapped in the upper one-third and lower one-third of the appliance's vertical dimensions; at the lower point, a minimum distance of 4 in. shall be maintained above the controls.","CPC §507.2：热水器须在其竖向高度的上三分之一和下三分之一处锚固或绑扎；下绑点须距控制器至少4英寸。"],
 s:"2025 California Plumbing Code §507.2"},
{id:"B-CORE-12",ex:"B",sec:"core",
 q:["Under the asphalt shingle provisions of the CRC, what is the minimum roof slope on which asphalt shingles may be installed?","根据CRC沥青瓦条款，沥青瓦允许安装的最小屋面坡度是多少？"],
 o:[["2:12 (with double underlayment from 2:12 up to 4:12)","2:12（2:12至4:12须双层衬垫）"],["1/4:12","1/4:12"],["4:12 only","只能4:12及以上"],["6:12","6:12"]],
 e:["CRC §R905: asphalt shingles shall be used only on roof slopes of 2 units vertical in 12 horizontal or greater; slopes from 2:12 up to less than 4:12 require double underlayment (§R905).","CRC §R905：沥青瓦只能用于坡度2:12及以上的屋面；2:12至小于4:12须铺设双层衬垫（§R905）。"],
 s:"2025 California Residential Code §R905, §R905"},
{id:"B-CORE-13",ex:"B",sec:"core",
 q:["A higher R-value for an insulation product means:","保温材料的R值越高意味着："],
 o:[["Greater resistance to heat flow","热阻越大（隔热越好）"],["Greater heat conduction","导热越强"],["Greater fire resistance rating","防火等级越高"],["Greater sound transmission","传声越强"]],

(function(){
"use strict";
const KEY="cslb-b-study-v1";
const $app=document.getElementById("app");
const QMAP={}; QUESTIONS.forEach(q=>QMAP[q.id]=q);
let S=load();
function blank(){return {lang:"bi",target:70,stats:{},wrong:{},history:[],mockFeedback:true,mockMinPerQ:2}}
function load(){try{const r=localStorage.getItem(KEY);if(r){return Object.assign(blank(),JSON.parse(r))}}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function T(pair){ // bilingual text block
  if(S.lang==="en")return `<div class="q-en">${esc(pair[0])}</div>`;
  if(S.lang==="zh")return `<div class="q-zh">${esc(pair[1])}</div>`;
  return `<div class="bi"><div class="q-en">${esc(pair[0])}</div><div class="q-zh">${esc(pair[1])}</div></div>`;
}
function Tinline(pair){
  if(S.lang==="en")return esc(pair[0]);
  if(S.lang==="zh")return esc(pair[1]);
  return `${esc(pair[0])}<small>${esc(pair[1])}</small>`;
}
function P(text){return `<p style="margin:0">${text}</p>`}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secName(ex,sec,i){return EXAMS[ex].sections[sec].name[i??1]}
function bank(ex,sec){return QUESTIONS.filter(q=>q.ex===ex&&(!sec||q.sec===sec))}
function record(id,ok){
  const st=S.stats[id]||(S.stats[id]={n:0,c:0,streak:0});
  st.n++; if(ok){st.c++;st.streak++}else{st.streak=0}
  if(!ok)S.wrong[id]={t:Date.now(),streak:0};
  else if(S.wrong[id]){S.wrong[id].streak=(S.wrong[id].streak||0)+1; if(S.wrong[id].streak>=2)delete S.wrong[id];}
  save();
}
function setTitle(t,back){document.getElementById("title").textContent=t;const b=document.getElementById("backBtn");b.hidden=!back;b.onclick=back||null}
document.querySelectorAll(".lang button").forEach(b=>{b.onclick=()=>{S.lang=b.dataset.lang;save();syncLang();rerender()}});
function syncLang(){document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===S.lang)))}
let rerender=home;
let timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}

// ---------- HOME ----------
function examSummary(ex){
  const qs=bank(ex);let seen=0,c=0,n=0;
  qs.forEach(q=>{const s=S.stats[q.id];if(s){seen++;c+=s.c;n+=s.n}});
  const wrong=qs.filter(q=>S.wrong[q.id]).length;
  return {total:qs.length,seen,acc:n?Math.round(c/n*100):null,wrong};
}
function home(){
  stopTimer();rerender=home;setTitle("CSLB B 执照题库",null);
  const card=ex=>{const m=examSummary(ex);const pct=Math.round(m.seen/m.total*100);
    return `<section class="card">
      <div class="eyebrow">${ex==="LB"?"Exam 1 · Law & Business":"Exam 2 · Trade (B)"}</div>
      <h3>${esc(EXAMS[ex].name[1])} <span class="muted small">${esc(EXAMS[ex].name[0])}</span></h3>
      <div class="meter" aria-label="已练习比例"><i style="width:${pct}%"></i></div>
      <div class="stats">
        <div class="stat"><b>${m.seen}/${m.total}</b><span>已练题目</span></div>
        <div class="stat"><b>${m.acc===null?"–":m.acc+"%"}</b><span>累计正确率</span></div>
        <div class="stat"><b>${m.wrong}</b><span>错题本</span></div>
      </div>
      <div class="row">
        <button class="btn primary grow" data-act="practice" data-ex="${ex}">练习模式</button>
        <button class="btn blue grow" data-act="mock" data-ex="${ex}">模拟考试</button>
        <button class="btn grow" data-act="wrong" data-ex="${ex}" ${m.wrong?"":"disabled"}>错题复习 (${m.wrong})</button>
      </div></section>`};
  const last=S.history.slice(-3).reverse();
  $app.innerHTML=`
  <div class="note"><b>原创练习题，不是CSLB真题。</b> CSLB考题保密，市面上不存在合法的“官方题目+标准答案”。本题库依据CSLB公开考试大纲自编，每题注明法规出处。</div>
  <section class="card"><div class="eyebrow">学习路线 · Study path</div>
    <div class="study">
      <button class="btn" data-act="plan"><span>8 周计划</span><small>${(()=>{const p=S.plan||{};const c=PLAN.find(x=>!p[x.w]);return c?"本周：第 "+c.w+" 周":"已全部完成"})()}</small></button>
      <button class="btn" data-act="keys"><span>必背重点</span><small>高亮数字速记</small></button>
      <button class="btn full" data-act="fullLB"><span>全真模拟 · 法律商务</span><small>全部 ${bank("LB").length} 题 · 纯英文</small></button>
      <button class="btn full" data-act="fullB"><span>全真模拟 · B 专业</span><small>全部 ${bank("B").length} 题 · 纯英文</small></button>
    </div></section>
  ${card("LB")}${card("B")}
  ${last.length?`<section class="card"><h3>最近模拟考试</h3><table><tbody>${last.map(h=>`<tr><td>${new Date(h.t).toLocaleDateString()} · ${h.ex==="LB"?"法律商务":"B专业"}${h.full?" · 全真":""}</td><td class="n">${h.c}/${h.n}</td><td class="n ${h.pct>=S.target?"pass":"fail"}">${h.pct}%</td></tr>`).join("")}</tbody></table></section>`:""}
  <div class="row"><button class="btn grow" data-act="info">考试信息与出处</button><button class="btn grow" data-act="settings">设置与备份</button></div>`;

function startPractice(ex,sec,wrongOnly){
  let qs=wrongOnly?bank(ex).filter(q=>S.wrong[q.id]):bank(ex,sec);
  // unseen and weak first, then shuffle within
  qs=shuffle(qs).sort((a,b)=>score(a)-score(b));
  const sess={ex,sec,wrongOnly,list:qs.map(q=>({id:q.id,order:shuffle([0,1,2,3]),pick:null})),i:0,c:0};
  practiceQ(sess);

function score(q){const s=S.stats[q.id];if(!s)return 0;return 1+s.c/s.n}
function practiceQ(sess){
  rerender=()=>practiceQ(sess);
  const label=sess.wrongOnly?"错题复习":(sess.sec?secName(sess.ex,sess.sec):"全部科目");
  setTitle(label,()=>sess.wrongOnly?home():pickSection(sess.ex));

  <section class="card">${T(q.q)}<div class="opts">${optsHtml}</div></section>
  ${answered?`<section class="card">
    <div class="verdict ${ok?"ok":"bad"}">${ok?"✓ 正确 Correct":"✗ 错误 Incorrect"}</div>
    ${ok?"":`<div class="small">正确答案：${Tinline(q.o[0])}</div>`}
    <div class="exp ${ok?"":"bad"}">${S.lang!=="zh"?P(hlExp(q.e[0])):""}${S.lang!=="en"?P(hlExp(q.e[1])):""}</div>
    <div class="src">出处 Source: ${esc(q.s)} · ${q.id}</div>
  </section>`:""}
  <div class="toolbar">
    ${answered?`<button class="btn primary" id="next">${sess.i+1<sess.list.length?"下一题 Next":"查看结果"}</button>`:`<button class="btn" id="skip">跳过 Skip</button>`}
  </div>`;
  $app.onclick=e=>{
    const o=e.target.closest(".opt");
    if(o&&!answered){it.pick=+o.dataset.oi;const good=it.pick===0;if(good)sess.c++;record(q.id,good);practiceQ(sess);
      const v=document.querySelector(".verdict");if(v)v.scrollIntoView({block:"nearest",behavior:"smooth"});return}
    if(e.target.id==="next"){sess.i++;practiceQ(sess);window.scrollTo(0,0)}

  };
}

  $app.innerHTML=`<h2>${esc(EXAMS[ex].name[1])}模拟考试</h2>
  <section class="card">
    <div class="eyebrow">题量 Questions</div>

    <p class="small muted" style="margin:0">本次：${n}题 · 限时 ${mins} 分钟 · 题目按CSLB大纲权重抽取 · 及格目标 ${S.target}%（自设，可在设置中修改）</p>

  </section>

  $app.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.n){mockSetup.n=+b.dataset.n;mockSetup(ex)}
    else if(b.dataset.m){S.mockMinPerQ=+b.dataset.m;save();mockSetup(ex)}
    else if(b.dataset.f){S.mockFeedback=b.dataset.f==="1";save();mockSetup(ex)}
    else if(b.id==="go")startMock(ex,n)};
